<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberShield AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #080b12;
  --bg2: #0e1219;
  --bg3: #151b26;
  --bg4: #1c2433;
  --bg5: #232d40;
  --border: rgba(99,179,237,0.08);
  --border2: rgba(99,179,237,0.16);
  --border3: rgba(99,179,237,0.28);
  --accent: #38bdf8;
  --accent2: #7dd3fc;
  --accent3: #0ea5e9;
  --glow: rgba(56,189,248,0.18);
  --glow2: rgba(56,189,248,0.08);
  --text: #e8f4fd;
  --text2: #7ea8c4;
  --text3: #3d6278;
  --user-bg: linear-gradient(135deg,#0ea5e9,#38bdf8);
  --bot-bg: #0e1219;
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --purple: #a78bfa;
  --font: 'Sora', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --r: 14px;
}
[data-theme="light"] {
  --bg: #f0f6ff;
  --bg2: #ffffff;
  --bg3: #e8f2fb;
  --bg4: #ddeeff;
  --bg5: #cce4f6;
  --border: rgba(14,165,233,0.1);
  --border2: rgba(14,165,233,0.2);
  --border3: rgba(14,165,233,0.35);
  --glow: rgba(14,165,233,0.12);
  --glow2: rgba(14,165,233,0.05);
  --text: #0c2340;
  --text2: #3a6080;
  --text3: #7aaac4;
  --bot-bg: #ffffff;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); }
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.4; }
.app { display: flex; height: 100vh; position: relative; z-index: 1; }
.sidebar {
  width: 280px; flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border2);
  display: flex; flex-direction: column;
  transition: transform 0.35s cubic-bezier(.4,0,.2,1);
  position: relative; z-index: 10;
}
.sidebar::after {
  content: '';
  position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, var(--accent), transparent);
  opacity: 0.3;
}
.sb-header { padding: 22px 18px 18px; border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.logo-orb {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent3), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; position: relative; overflow: hidden;
  box-shadow: 0 0 20px var(--glow), inset 0 1px 0 rgba(255,255,255,0.15);
  animation: orbPulse 3s ease-in-out infinite;
}
@keyframes orbPulse {
  0%,100% { box-shadow: 0 0 20px var(--glow); }
  50% { box-shadow: 0 0 35px var(--glow), 0 0 60px var(--glow2); }
}
.logo-name { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.logo-name span { color: var(--accent); }
.new-btn {
  width: 100%; padding: 11px 14px;
  background: linear-gradient(135deg, var(--accent3), var(--accent));
  border: none; border-radius: var(--r);
  color: white; font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: all 0.25s;
  box-shadow: 0 4px 16px var(--glow);
}
.new-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--glow); }
.sb-section { padding: 16px 18px 6px; font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; }
.sb-list { flex: 1; overflow-y: auto; padding: 4px 10px; }
.sb-item {
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  font-size: 13px; color: var(--text2); display: flex; align-items: center;
  gap: 10px; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 1px solid transparent;
}
.sb-item:hover { background: var(--bg3); color: var(--text); border-color: var(--border); }
.sb-item.active { background: var(--bg4); color: var(--accent); border-color: var(--border2); }
.sb-item .icon { font-size: 14px; flex-shrink: 0; }
.sb-footer { padding: 14px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.sb-btn {
  padding: 10px 12px; background: transparent; border: 1px solid var(--border);
  border-radius: 10px; color: var(--text2); font-family: var(--font); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; width: 100%;
}
.sb-btn:hover { background: var(--bg3); border-color: var(--border2); color: var(--text); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  background: var(--bg2); border-bottom: 1px solid var(--border2);
  flex-shrink: 0; position: relative; z-index: 5;
}
.tb-left { display: flex; align-items: center; gap: 14px; }
.menu-btn { display: none; background: none; border: none; color: var(--text2); font-size: 22px; cursor: pointer; padding: 2px 6px; }
.status-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: var(--bg3);
  border: 1px solid var(--border2); border-radius: 20px;
  font-size: 12px; font-weight: 500; color: var(--text2);
}
.pulse { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: pulseDot 2s infinite; }
@keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.5} }
.tb-right { display: flex; gap: 8px; align-items: center; }
.tb-btn {
  width: 36px; height: 36px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text2); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.chat { flex: 1; overflow-y: auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 4px; }
.welcome {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; text-align: center; padding: 48px 24px; gap: 24px;
}
.welcome-orb {
  width: 88px; height: 88px; border-radius: 24px;
  background: linear-gradient(135deg, var(--accent3), var(--accent));
  display: flex; align-items: center; justify-content: center; font-size: 44px;
}
.welcome h1 {
  font-size: 32px; font-weight: 800;
}
.welcome-sub { font-size: 15px; color: var(--text2); max-width: 420px; line-height: 1.65; }
.welcome-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  max-width: 640px; width: 100%;
}
.wcard {
  padding: 14px; background: var(--bg2);
  border: 1px solid var(--border2); border-radius: 14px;
  cursor: pointer; transition: all 0.25s; text-align: left;
}
.wcard-icon { font-size: 22px; margin-bottom: 8px; }
.wcard-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.wcard-desc { font-size: 11px; color: var(--text2); line-height: 1.4; }
.bottom { padding: 14px 24px 18px; background: var(--bg2); border-top: 1px solid var(--border2); }
.input-box {
  max-width: 820px; margin: 0 auto;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 18px; padding: 13px 14px;
  display: flex; align-items: flex-end; gap: 10px;
}
#inp {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 14px;
  resize: none; min-height: 22px; max-height: 150px;
}
.send {
  width: 36px; height: 36px; background: linear-gradient(135deg,var(--accent3),var(--accent));
  border: none; border-radius: 11px; color: white; font-size: 16px;
  cursor: pointer;
}
.msg-wrap { max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
.msg-wrap.user { align-items: flex-end; }
.msg-wrap.bot { align-items: flex-start; }
.msg-header { display: flex; align-items: center; gap: 8px; padding: 0 2px; margin-bottom: 5px; }
.avatar {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.msg-wrap.bot .avatar { background: linear-gradient(135deg,var(--accent3),var(--accent)); }
.msg-wrap.user .avatar { background: var(--bg4); }
.bubble {
  padding: 13px 17px; border-radius: 16px; font-size: 14px;
  line-height: 1.75; word-break: break-word; max-width: 78%;
}
.msg-wrap.user .bubble {
  background: linear-gradient(135deg, var(--accent3), var(--accent));
  color: white;
}
.msg-wrap.bot .bubble {
  background: var(--bot-bg); border: 1px solid var(--border2);
  color: var(--text);
}
@media(max-width:720px){
  .welcome-grid { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="app">
  <div class="sidebar">
    <div class="sb-header">
      <div class="logo">
        <div class="logo-orb">🛡️</div>
        <div class="logo-name">Cyber<span>Shield</span></div>
      </div>
      <button class="new-btn" onclick="newChat()">✏️ New Chat</button>
    </div>

    <div class="sb-section">Chats</div>
    <div class="sb-list">
      <div class="sb-item active"><span class="icon">🛡️</span> Cyber Safety</div>
      <div class="sb-item"><span class="icon">🔐</span> Password Guide</div>
      <div class="sb-item"><span class="icon">💳</span> OTP Fraud Help</div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <div class="status-pill">
          <div class="pulse"></div>
          CyberShield AI · Secure Mode
        </div>
      </div>
      <div class="tb-right">
        <button class="tb-btn" onclick="newChat()">🗑️</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-orb">🛡️</div>
        <h1>CyberShield AI</h1>
        <p class="welcome-sub">Your AI-powered cyber safety companion for India.</p>
        <div class="welcome-grid">
          <div class="wcard" onclick="ask('What is phishing?')">
            <div class="wcard-icon">⚡</div>
            <div class="wcard-title">Phishing Scams</div>
            <div class="wcard-desc">Spot fake emails & links</div>
          </div>
          <div class="wcard" onclick="ask('What is OTP fraud?')">
            <div class="wcard-icon">💳</div>
            <div class="wcard-title">OTP Fraud</div>
            <div class="wcard-desc">Protect bank accounts</div>
          </div>
          <div class="wcard" onclick="ask('How to create a strong password?')">
            <div class="wcard-icon">🔐</div>
            <div class="wcard-title">Strong Passwords</div>
            <div class="wcard-desc">Make secure passwords</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="input-box">
        <textarea id="inp" placeholder="Ask me anything about cyber safety..." rows="1" onkeydown="onKey(event)"></textarea>
        <button class="send" onclick="send()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = '';

const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');

function onKey(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    send();
  }
}

function ask(q){
  document.getElementById('inp').value = q;
  send();
}

function newChat(){
  chat.innerHTML = '';
  chat.appendChild(welcome);
  welcome.style.display = 'flex';
}

function send(){
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;

  welcome.style.display = 'none';

  const user = document.createElement('div');
  user.className = 'msg-wrap user';
  user.innerHTML = `
    <div class="msg-header"><div class="avatar">👤</div></div>
    <div class="bubble">${text}</div>
  `;
  chat.appendChild(user);

  const bot = document.createElement('div');
  bot.className = 'msg-wrap bot';
  bot.innerHTML = `
    <div class="msg-header"><div class="avatar">🛡️</div></div>
    <div class="bubble">⚠️ Backend not connected. Add your API securely using Node.js backend.</div>
  `;
  chat.appendChild(bot);

  inp.value = '';
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
